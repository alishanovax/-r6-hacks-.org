# Static Astro site — do not auto-add @astrojs/cloudflare (keeps output in dist/).
# Must match audit/preview host: https://r6-hacks--org.<account>.workers.dev
name = "r6-hacks--org"
main = "worker/canonical-host.mjs"
compatibility_date = "2025-10-11"

# Cloudflare CI runs `npx wrangler deploy` only; this produces dist/ before upload.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "none"

# Serve sitemaps and the app on the production hostname (same Worker as workers.dev).
[[routes]]
pattern = "r6hacks.org/*"
zone_name = "r6hacks.org"

[[routes]]
pattern = "www.r6hacks.org/*"
zone_name = "r6hacks.org"
